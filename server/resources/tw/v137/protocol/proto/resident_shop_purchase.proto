syntax = "proto3";

package proto;
import public "public.proto";

message ResidentShopPurchaseReq {
  uint32 ShopId = 1;
  int64 RefreshTime = 2;
  uint32 GoodsId = 3;
  uint32 Number = 4;
  bytes NextPackage = 2047;
}

message ResidentShopPurchaseResp {
  bool IsRefresh = 1;
  .proto.ResidentShop Shop = 2;
  uint32 PurchasedNumber = 3;
  .proto.ChangeInfo Change = 4;
  bytes NextPackage = 2047;
}
