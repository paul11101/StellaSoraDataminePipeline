syntax = "proto3";

package proto;
import public "public.proto";

message VampireSurvivorRewardSelectReq {
  bytes NextPackage = 2047;

  oneof Select {
    uint32 Index = 1;
    bool ReRoll = 2;
  }
}

message VampireSurvivorRewardSelectResp {
  message Success {
    uint32 FateCardId = 1;
    .proto.VampireSurvivorLevelReward Reward = 2;
    repeated .proto.CardInfo ExtraCards = 3;
  }

  bytes NextPackage = 2047;

  oneof Result {
    .proto.VampireSurvivorRewardSelectResp.Success Resp = 1;
    .proto.VampireSurvivorFateCardSelect Pkg = 2;
  }
}
