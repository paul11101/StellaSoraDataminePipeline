syntax = "proto3";

package proto;
import public "public.proto";

message SkillInstanceSweepReq {
  uint32 Id = 1;
  uint32 Times = 2;
  .proto.Events Events = 15;
  bytes NextPackage = 2047;
}

message SkillInstanceSweepResp {
  .proto.ChangeInfo Change = 1;
  repeated .proto.SkillInstanceSweepRewards Rewards = 2;
  bytes NextPackage = 2047;
}

message SkillInstanceSweepRewards {
  repeated .proto.ItemTpl AwardItems = 1;
  uint32 Exp = 2;
  repeated .proto.ItemTpl DoubleItems = 3;
  bytes NextPackage = 2047;
}
