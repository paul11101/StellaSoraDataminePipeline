syntax = "proto3";

package proto;
import public "public.proto";

message ActivityLevelsSweepReq {
  uint32 ActivityId = 1;
  uint32 LevelId = 2;
  uint32 Times = 3;
  .proto.Events Events = 15;
  bytes NextPackage = 2047;
}

message ActivityLevelsSweepReward {
  repeated .proto.ItemTpl AwardItems = 1;
  uint32 Exp = 2;
  bytes NextPackage = 2047;
}

message ActivityLevelsSweepResp {
  .proto.ChangeInfo ChangeInfo = 1;
  repeated .proto.ActivityLevelsSweepReward Rewards = 2;
  bytes NextPackage = 2047;
}
