syntax = "proto3";

package proto;
import public "public.proto";

message TravelerDuelQuestRewardReceiveReq {
  uint32 Id = 1;
  .proto.QuestType Type = 2;
  bytes NextPackage = 2047;
}

message TravelerDuelQuestRewardReceiveResp {
  repeated .proto.ItemTpl QuestRewards = 1;
  .proto.ChangeInfo Change = 2;
  bytes NextPackage = 2047;
}
