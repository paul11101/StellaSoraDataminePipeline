syntax = "proto3";

package proto;
import public "public.proto";

message BattlePassRewardReceiveReq {
  uint32 Version = 4;
  bytes NextPackage = 2047;

  oneof Mode {
    .proto.Nil All = 1;
    uint32 Basic = 2;
    uint32 Premium = 3;
  }
}

message BattlePassRewardReceiveResp {
  bytes BasicReward = 1;
  bytes PremiumReward = 2;
  .proto.ChangeInfo Change = 3;
  bytes NextPackage = 2047;
}
