syntax = "proto3";

package proto;
import public "public.proto";
import public "public_joint_drill.proto";
import public "public_star_tower.proto";

message JointDrillRankInfo {
  int64 LastRefreshTime = 1;
  .proto.JointDrillRankData Self = 2;
  repeated .proto.JointDrillRankData Rank = 3;
  uint32 Total = 4;
  bytes NextPackage = 2047;
}

message JointDrillRankChar {
  uint32 Id = 1;
  uint32 Level = 2;
  bytes NextPackage = 2047;
}

message JointDrillRankTeam {
  repeated .proto.JointDrillRankChar Chars = 1;
  uint32 BuildScore = 2;
  uint32 Damage = 3;
  uint32 Time = 4;
  repeated uint32 Discs = 5;
  repeated .proto.BuildPotential Potentials = 6;
  repeated .proto.ItemTpl Notes = 7;
  repeated uint32 ActiveSecondaryIds = 8;
  bytes NextPackage = 2047;
}

message JointDrillRankData {
  uint64 Id = 1;
  string NickName = 2;
  uint32 WorldClass = 3;
  uint32 HeadIcon = 4;
  uint32 Score = 5;
  uint32 Rank = 6;
  uint32 TitlePrefix = 7;
  uint32 TitleSuffix = 8;
  repeated .proto.HonorInfo Honors = 9;
  repeated .proto.JointDrillRankTeam Teams = 10;
  bytes NextPackage = 2047;
}

message JointDrillRankTeams {
  repeated .proto.JointDrillRankTeam Teams = 1;
  bytes NextPackage = 2047;
}
