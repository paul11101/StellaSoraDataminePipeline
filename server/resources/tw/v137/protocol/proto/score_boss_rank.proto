syntax = "proto3";

package proto;
import public "public.proto";
import public "public_star_tower.proto";

message ScoreBossRankInfo {
  int64 LastRefreshTime = 1;
  .proto.ScoreBossRankData Self = 2;
  repeated .proto.ScoreBossRankData Rank = 3;
  repeated uint64 Border = 4;
  uint32 Total = 5;
  bytes NextPackage = 2047;
}

message ScoreBossRankChar {
  uint32 Id = 1;
  uint32 Level = 2;
  bytes NextPackage = 2047;
}

message ScoreBossRankTeam {
  uint32 BuildScore = 1;
  repeated .proto.ScoreBossRankChar Chars = 2;
  uint32 LevelScore = 3;
  uint32 LevelId = 4;
  repeated uint32 Discs = 5;
  repeated .proto.BuildPotential Potentials = 6;
  repeated .proto.ItemTpl Notes = 7;
  repeated uint32 ActiveSecondaryIds = 8;
  uint32 SkillScore = 9;
  bytes NextPackage = 2047;
}

message ScoreBossRankData {
  uint64 Id = 1;
  string NickName = 2;
  uint32 WorldClass = 3;
  uint32 HeadIcon = 4;
  uint32 Score = 5;
  uint32 Rank = 6;
  uint32 TitlePrefix = 7;
  uint32 TitleSuffix = 8;
  repeated .proto.ScoreBossRankTeam Teams = 9;
  repeated .proto.HonorInfo Honors = 15;
  bytes NextPackage = 2047;
}

message ScoreBossRankTeams {
  repeated .proto.ScoreBossRankTeam Teams = 1;
  bytes NextPackage = 2047;
}
