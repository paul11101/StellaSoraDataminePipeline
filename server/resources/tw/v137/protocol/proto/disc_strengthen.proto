syntax = "proto3";

package proto;
import public "public.proto";

message DiscStrengthenReq {
  uint32 Id = 1;
  repeated .proto.ItemInfo Items = 2;
  bytes NextPackage = 2047;
}

message DiscStrengthenResp {
  uint32 Level = 1;
  uint32 Exp = 2;
  .proto.ChangeInfo Change = 3;
  bytes NextPackage = 2047;
}
