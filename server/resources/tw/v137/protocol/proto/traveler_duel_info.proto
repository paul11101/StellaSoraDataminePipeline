syntax = "proto3";

package proto;
import public "public.proto";

message TravelerDuelInfo {
  uint32 DuelLevel = 1;
  uint32 DuelExp = 2;
  uint32 WeeklyAwardTimes = 3;
  repeated .proto.TravelerDuelBossLevel Levels = 4;
  .proto.TravelerDuelChallengeInfo Challenge = 5;
  .proto.Quests Quests = 6;
  bytes NextPackage = 2047;
}
