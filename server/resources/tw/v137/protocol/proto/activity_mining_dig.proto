syntax = "proto3";

package proto;
import public "public.proto";
import public "public_mining.proto";

message ActivityMiningDigReq {
  uint32 ActivityId = 1;
  uint32 GridId = 2;
  bytes NextPackage = 2047;
}

message ActivityMiningDigResp {
  .proto.ChangeInfo ChangeInfo = 1;
  .proto.MiningChangeInfo MiningChangeInfo = 2;
  bytes NextPackage = 2047;
}
