syntax = "proto3";

package proto;
import public "public.proto";

message DailyInstanceRaidReq {
  uint32 Id = 1;
  uint32 RewardType = 2;
  uint32 Times = 4;
  .proto.Events Events = 15;
  bytes NextPackage = 2047;
}

message DailyInstanceReward {
  repeated .proto.Item Select = 1;
  repeated .proto.Item DoubleItems = 2;
  uint32 Exp = 15;
  bytes NextPackage = 2047;
}

message DailyInstanceRaidResp {
  repeated .proto.DailyInstanceReward Rewards = 1;
  .proto.ChangeInfo Change = 2;
  bytes NextPackage = 2047;
}
