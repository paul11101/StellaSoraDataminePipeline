syntax = "proto3";

package proto;
import public "public.proto";

message TraceHuntRecommendation {
  uint64 OwnerUID = 1;
  uint32 BossID = 2;
  int64 BossCreateTime = 3;
  bool IsFriend = 4;
  bool IsStar = 5;
  .proto.Friend Info = 6;
  bytes NextPackage = 2047;
}

message TraceHuntRecommendResp {
  repeated .proto.TraceHuntRecommendation Recommendations = 1;
  bytes NextPackage = 2047;
}
