syntax = "proto3";

package proto;
import public "public_mining.proto";

message ActivityMiningMoveToNextLayerReq {
  uint32 ActivityId = 1;
  bytes NextPackage = 2047;
}

message ActivityMiningMoveToNextLayerResp {
  .proto.MiningLayer Layer = 1;
  .proto.MiningChangeInfo MiningChangeInfo = 2;
  bytes NextPackage = 2047;
}
