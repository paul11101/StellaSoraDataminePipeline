syntax = "proto3";

package proto;
import public "public.proto";
import public "public_mining.proto";
import public "public_star_tower.proto";
import public "public_soldier.proto";

message NewAgent {
  repeated uint32 Ids = 1;
  bytes NextPackage = 2047;
}

message SigninRewardUpdate {
  uint32 Index = 1;
  .proto.ChangeInfo Change = 2;
  bool Switch = 6;
  bytes NextPackage = 2047;
}

message OrderStateChange {
  string OrderId = 1;
  uint32 Store = 2;
  bytes NextPackage = 2047;
}

message StarTowerBookPotentialChange {
  repeated .proto.StarTowerBookCharPotential CharPotentials = 1;
  repeated uint32 CharIds = 2;
  bytes NextPackage = 2047;
}

message StarTowerBookEventChange {
  repeated uint32 EventIds = 1;
  bytes NextPackage = 2047;
}

message Skin {
  message Transform {
    uint32 ID = 1;
    repeated .proto.ItemTpl Items = 2;
  }

  bytes NextPackage = 2047;

  oneof Type {
    .proto.UI32 New = 1;
    .proto.Skin.Transform Duplicated = 2;
  }
}

message SkinChange {
  uint32 CharId = 1;
  uint32 SkinId = 2;
  bytes NextPackage = 2047;
}

message MonthlyCardRewards {
  uint32 Id = 1;
  .proto.ChangeInfo Change = 2;
  int64 EndTime = 3;
  repeated .proto.ItemTpl Rewards = 4;
  uint32 Remaining = 5;
  bool Switch = 6;
  bytes NextPackage = 2047;
}

message TowerBookFateCardCollectNotify {
  repeated uint32 Cards = 1;
  bytes NextPackage = 2047;
}

message TowerBookFateCardRewardChangeNotify {
  repeated uint32 List = 1;
  bool Option = 2;
  bytes NextPackage = 2047;
}

message HonorChangeNotify {
  repeated .proto.HonorInfo Honors = 1;
  bytes NextPackage = 2047;
}

message NoticeChangeNotify {
  string Content = 1;
  repeated int32 Channel = 2;
  int64 StartTime = 3;
  int64 EndTime = 4;
  int32 Interval = 5;
  int32 Duration = 6;
  bool IsStop = 7;
  bytes NextPackage = 2047;
}

message PlayerHeadIconChangeNotify {
  uint32 Set = 1;
  uint32 Del = 2;
  bytes NextPackage = 2047;
}

message ActivityMiningEnterLayerNotify {
  .proto.MiningLayer Layer = 1;
  .proto.MiningChangeInfo MiningChangeInfo = 2;
  bytes NextPackage = 2047;
}

message OrderCollected {
  repeated .proto.OrderStateChange Orders = 1;
  bytes NextPackage = 2047;
}

message MilkoutCharacterUnlockNotify {
  uint32 ActivityId = 1;
  uint32 CharId = 2;
  bytes NextPackage = 2047;
}

message ActivityDoubleRewardTimesNotify {
  uint32 ActivityId = 1;
  uint32 UseTimes = 2;
  bytes NextPackage = 2047;
}
