syntax = "proto3";

package proto;
import public "public.proto";

message TraceHuntSettleReq {
  uint32 Score = 1;
  uint32 Star = 2;
  .proto.Events Events = 15;
  bytes NextPackage = 2047;
}

message TraceHuntSettleResp {
  uint32 Level = 1;
  uint32 Exp = 2;
  .proto.ChangeInfo ChangeInfo = 3;
  uint32 SelfHuntTimes = 4;
  int64 BossCreateTime = 5;
  repeated .proto.TraceHuntLogEntry HuntLog = 6;
  bytes NextPackage = 2047;
}
